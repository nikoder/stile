<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>stile</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="card">
    <h1><span class="key">🔑</span> stile</h1>

    <form id="login" class="hidden">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" autocapitalize="none"
             spellcheck="false" required autofocus>
      <div style="height:0.4rem"></div>
      <button id="go" type="submit">Sign in &amp; tap key</button>
      <p class="hint">Presence-only hardware key. No password, no PIN.</p>
    </form>

    <div id="authed" class="hidden">
      <p>Signed in as <strong id="who"></strong>.</p>
      <p id="continue" class="hidden"><a id="continueLink" href="/">Continue to your destination →</a></p>

      <h2>Your keys</h2>
      <ul id="keys" class="keys"></ul>
      <div class="row">
        <button id="addKey" class="secondary" type="button">Add a key</button>
        <button id="logout" class="secondary" type="button">Sign out</button>
      </div>
      <p class="hint">Adding or removing a key asks for a fresh tap of an
        existing key first.</p>

      <div id="adminBox" class="hidden">
        <h2>Invite (admin)</h2>
        <form id="inviteForm" class="row">
          <input id="inviteUser" placeholder="username" autocapitalize="none" spellcheck="false" required>
          <button type="submit" class="secondary">Mint invite</button>
        </form>
        <p id="inviteOut" class="hint" style="word-break:break-all"></p>
      </div>
    </div>

    <p id="msg" class="msg"></p>
    <p id="enrollHint" class="hint hidden"><a href="/enroll">First-time setup: enroll the first key →</a></p>
  </main>

  <script src="/static/webauthn.js"></script>
  <script src="/static/portal.js"></script>
</body>
</html>
